server {
    listen 80;
    server_name aryaathoillah_jastip.diazridho.cloud;

    return 301 https://aryaathoillah_jastip.diazridho.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name aryaathoillah_jastip.diazridho.cloud;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/aryaathoillah_jastip.diazridho.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aryaathoillah_jastip.diazridho.cloud/privkey.pem;


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}